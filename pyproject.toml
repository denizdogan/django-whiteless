[build-system]
requires = ["uv_build>=0.13.5,<0.14"]
build-backend = "uv_build"

[project]
name = "django-whiteless"
version = "2.0.0"
description = "Django template tags for dealing with pesky whitespaces"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Deniz Dogan", email = "denizdogan@users.noreply.github.com" },
]
keywords = ["django", "whitespace", "template", "tag"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Framework :: Django :: 6.1",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Typing :: Typed",
]
dependencies = ["Django>=5.2,<6.2"]

[project.urls]
Homepage = "https://github.com/denizdogan/django-whiteless"
Repository = "https://github.com/denizdogan/django-whiteless.git"
Documentation = "https://github.com/denizdogan/django-whiteless#readme"
Issues = "https://github.com/denizdogan/django-whiteless/issues"
Changelog = "https://github.com/denizdogan/django-whiteless/blob/master/CHANGELOG.md"

[dependency-groups]
django52 = ["Django>=5.2,<5.3"]
django60 = ["Django>=6.0,<6.1"]
django61 = ["Django>=6.1,<6.2"]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.14.0",
    "ruff>=0.17.2",
    "tox>=4.67.1",
    "tox-uv-bare>=1.37.0",
    "ty>=0.0.91",
]

[tool.uv]
conflicts = [
    [
        { group = "django52" },
        { group = "django60" },
        { group = "django61" },
    ],
]

[tool.uv.dependency-groups]
django60 = { requires-python = ">=3.12" }
django61 = { requires-python = ">=3.12" }

[tool.uv.build-backend]
module-name = "whiteless"
module-root = ""
source-include = ["tests/**", "CHANGELOG.md"]

[tool.pytest.ini_options]
django_find_project = false
DJANGO_SETTINGS_MODULE = "tests.settings"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["whiteless"]

[tool.coverage.report]
show_missing = true
